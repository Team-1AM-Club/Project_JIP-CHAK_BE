services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/team-1am-club/project_jip-chak:latest}
    container_name: jipchak_app
    restart: always
    env_file: .env
    environment:
      - DATA_PROVIDER=db
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jipchak_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: jipchak_nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443"  # HTTPS 적용 시 주석 해제
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro       # HTTPS 적용 시
      # - ./certbot/www:/var/www/certbot:ro        # HTTPS 적용 시
    depends_on:
      app:
        condition: service_started
    networks:
      - jipchak_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgis/postgis:16-3.4
    container_name: jipchak_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_HOST}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d jipchak" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jipchak_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: jipchak_redis
    restart: always
    command: [ "redis-server", "--appendonly", "yes" ]
    # ports 제거 - 외부 노출 X
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jipchak_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jipchak_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
