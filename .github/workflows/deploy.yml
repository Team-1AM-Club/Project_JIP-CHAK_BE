name: JIP:CHAK CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/team-1am-club/project_jip-chak:latest
  CONTAINER_NAME: project_jip-chak

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Lowercase Image Name
      run: |
        echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_NAME }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Prepare VM Directories
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        port: 22
        script: |
          sudo mkdir -p "${{ secrets.GCP_APP_DIR }}/nginx"
          sudo chown -R $USER:$USER "${{ secrets.GCP_APP_DIR }}"

    - name: Copy deployment files to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        port: 22
        source: "docker-compose.yml,nginx/nginx.conf"
        target: "${{ secrets.GCP_APP_DIR }}"

    - name: Deploy to GCP VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.GCP_HOST }}
        username: ${{ secrets.GCP_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        port: 22
        envs: IMAGE_NAME
        script: |
          APP_DIR="${{ secrets.GCP_APP_DIR }}"
          cd $APP_DIR
          
          # 1. 환경변수 파일(.env) 갱신
          echo "[1/4] 최신 환경변수 파일(.env) 생성 중..."
          ENV_PATH="$APP_DIR/.env"
          
          rm -f $ENV_PATH
          echo "IMAGE_NAME=$IMAGE_NAME" > $ENV_PATH
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $ENV_PATH
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> $ENV_PATH
          echo "DB_USER=${{ secrets.DB_USER }}" >> $ENV_PATH
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $ENV_PATH
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> $ENV_PATH
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $ENV_PATH
          echo "JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}" >> $ENV_PATH
          echo "ACCESS_TOKEN_EXPIRE=${{ secrets.ACCESS_TOKEN_EXPIRE }}" >> $ENV_PATH
          echo "REFRESH_TOKEN_EXPIRE=${{ secrets.REFRESH_TOKEN_EXPIRE }}" >> $ENV_PATH
          echo "GEOCODING_PROVIDER=${{ secrets.GEOCODING_PROVIDER }}" >> $ENV_PATH
          echo "NAVER_MAPS_CLIENT_ID=${{ secrets.NAVER_MAPS_CLIENT_ID }}" >> $ENV_PATH
          echo "NAVER_MAPS_CLIENT_SECRET=${{ secrets.NAVER_MAPS_CLIENT_SECRET }}" >> $ENV_PATH
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> $ENV_PATH
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> $ENV_PATH
          echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> $ENV_PATH
          echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> $ENV_PATH
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> $ENV_PATH
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> $ENV_PATH
          echo "UPSTAGE_AI_API_KEY=${{ secrets.UPSTAGE_AI_API_KEY }}" >> $ENV_PATH
          chmod 600 $ENV_PATH
          
          # 2. 서버에서 GHCR 로그인
          echo "[2/4] GHCR 로그인 중..."
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 3. 최신 이미지 다운로드 및 실행
          echo "[3/4] 최신 컨테이너 실행..."
          docker compose pull app
          docker compose up -d
          
          # 4. 미사용 이미지 정리
          echo "[4/4] 미사용 이미지 정리..."
          docker image prune -f
          
          echo "✅ 배포 성공!"